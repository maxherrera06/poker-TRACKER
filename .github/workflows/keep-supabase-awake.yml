# Supabase pauses free projects after a week with no database activity.
# This reads one row every 3 days so accounts never go to sleep.
# The key below is the public "publishable" key that's already in index.html.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 16 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        run: |
          curl -fsS "https://uyvaszvdxyugjkjxsjih.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_LFXTNvu7YBW2NxTCHjRMQA_H5uUNCLN" \
            -H "Authorization: Bearer sb_publishable_LFXTNvu7YBW2NxTCHjRMQA_H5uUNCLN" \
            -o /dev/null -w "Supabase answered %{http_code}\n"
